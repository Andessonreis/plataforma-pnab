name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy na VPS (Produção)
    runs-on: ubuntu-latest
    # Só roda se o CI da branch main terminou com sucesso (ou se for disparo manual)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do commit validado pelo CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # A VPS não tem acesso ao repo privado — ela clona do mirror público
      # Andessonreis/plataforma-pnab. Sem sincronizar aqui, o deploy abaixo
      # roda "git merge --ff-only" contra um fork desatualizado e não pega
      # os commits recém-mergeados.
      - name: Sincroniza fork público (a VPS clona de lá, não do repo privado)
        continue-on-error: true
        env:
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: |
          if [ -z "$FORK_PUSH_TOKEN" ]; then
            echo "::warning::FORK_PUSH_TOKEN não configurado — pulando sync do fork. Configure o secret pra automatizar de vez."
            exit 0
          fi
          git remote add fork "https://Andessonreis:${FORK_PUSH_TOKEN}@github.com/Andessonreis/plataforma-pnab.git"
          git push fork HEAD:main

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"

            ESPERADO="${{ github.event.workflow_run.head_sha || github.sha }}"

            # A VPS clona do fork público. Se o sync do fork ainda não chegou,
            # o fetch abaixo traz código velho e o deploy terminaria "com
            # sucesso" servindo a versão anterior — o modo de falha mais caro
            # que esse pipeline já teve. Então: espera o commit aparecer e
            # falha alto se ele não vier.
            for tentativa in $(seq 1 12); do
              git fetch origin main --quiet
              if git cat-file -e "${ESPERADO}^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "$ESPERADO" origin/main; then
                break
              fi
              echo "Commit $ESPERADO ainda não está no fork público (tentativa $tentativa/12) — aguardando 15s..."
              sleep 15
            done

            if ! git merge-base --is-ancestor "$ESPERADO" origin/main 2>/dev/null; then
              echo "::error::O fork público não tem o commit $ESPERADO. Rode 'git push andessonreis main' e redispare este deploy. (Configure o secret FORK_PUSH_TOKEN para isso ser automático.)"
              exit 1
            fi

            # Atualiza repo de forma resiliente: remove untracked que poderiam
            # bloquear fast-forward (logs, arquivos deixados por execuções manuais),
            # preservando .env, backups/ e .next/. Depois exige merge fast-forward.
            git clean -fd -e .env -e 'backups/' -e '.next/' -e '*.log'
            git merge --ff-only origin/main

            # Confirma que o código no disco contém o commit validado pelo CI.
            # (Pode estar à frente, se outro merge entrou no meio — isso é ok.)
            ATUAL="$(git rev-parse HEAD)"
            if ! git merge-base --is-ancestor "$ESPERADO" HEAD; then
              echo "::error::HEAD da VPS ($ATUAL) não contém o commit esperado ($ESPERADO) — abortando antes de buildar."
              exit 1
            fi
            echo "VPS em $ATUAL (contém $ESPERADO)"

            # Build das imagens
            docker compose -f docker-compose.prod.yml build

            # Aplica schema do Prisma via a imagem `app` recém-buildada
            # (stage `runner` rebuilda fresh — não tem o problema de cache que
            # o antigo service `migrate` tinha quando reusava o stage `builder`).
            docker compose -f docker-compose.prod.yml run --rm app npx prisma db push --skip-generate

            # Reinicia app e worker com as novas imagens
            docker compose -f docker-compose.prod.yml up -d app worker pnab-postgres pnab-redis

            # Limpa imagens antigas
            docker image prune -f
