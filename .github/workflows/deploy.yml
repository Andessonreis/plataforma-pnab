name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy na VPS (Produção)
    runs-on: ubuntu-latest
    # Token efêmero do próprio job — é com ele que a VPS busca o código.
    permissions:
      contents: read
    # Só roda se o CI da branch main terminou com sucesso (ou se for disparo manual)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do commit validado pelo CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Espelho público — mantido por conveniência (link compartilhável,
      # histórico visível fora da org). O deploy NÃO depende mais dele: a VPS
      # busca direto do repo privado com o token efêmero do job.
      - name: Sincroniza espelho público (opcional)
        continue-on-error: true
        env:
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: |
          if [ -z "$FORK_PUSH_TOKEN" ]; then
            echo "::notice::FORK_PUSH_TOKEN não configurado — espelho público não sincronizado automaticamente (não afeta o deploy)."
            exit 0
          fi
          git remote add fork "https://Andessonreis:${FORK_PUSH_TOKEN}@github.com/Andessonreis/plataforma-pnab.git"
          git push fork HEAD:main

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ESPERADO: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          # Token do próprio job: vale só enquanto ele roda e some depois.
          # É o que dispensa guardar credencial de longa duração na VPS.
          envs: GH_TOKEN,GH_REPO,ESPERADO
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"

            # Busca direto do repositório principal usando o token efêmero do
            # job. Antes a VPS puxava do espelho público, que precisava ser
            # sincronizado à mão a cada merge: quando o deploy corria antes
            # disso, ele republicava a versão anterior sem reclamar. A URL com
            # token fica só neste comando — não é gravada no .git/config.
            git fetch --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" main

            if ! git merge-base --is-ancestor "$ESPERADO" FETCH_HEAD 2>/dev/null; then
              echo "::error::O commit $ESPERADO não está no main do repositório. Deploy abortado."
              exit 1
            fi

            # Atualiza repo de forma resiliente: remove untracked que poderiam
            # bloquear fast-forward (logs, arquivos deixados por execuções manuais),
            # preservando .env, backups/ e .next/. Depois exige merge fast-forward.
            git clean -fd -e .env -e 'backups/' -e '.next/' -e '*.log'
            git merge --ff-only FETCH_HEAD

            # Confirma que o código no disco contém o commit validado pelo CI.
            # (Pode estar à frente, se outro merge entrou no meio — isso é ok.)
            ATUAL="$(git rev-parse HEAD)"
            if ! git merge-base --is-ancestor "$ESPERADO" HEAD; then
              echo "::error::HEAD da VPS ($ATUAL) não contém o commit esperado ($ESPERADO) — abortando antes de buildar."
              exit 1
            fi
            echo "VPS em $ATUAL (contém $ESPERADO)"

            # Build das imagens
            docker compose -f docker-compose.prod.yml build

            # Aplica schema do Prisma via a imagem `app` recém-buildada
            # (stage `runner` rebuilda fresh — não tem o problema de cache que
            # o antigo service `migrate` tinha quando reusava o stage `builder`).
            docker compose -f docker-compose.prod.yml run --rm app npx prisma db push --skip-generate

            # Reinicia app e worker com as novas imagens
            docker compose -f docker-compose.prod.yml up -d app worker pnab-postgres pnab-redis

            # Limpa imagens antigas
            docker image prune -f
