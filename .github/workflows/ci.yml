name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Fix rollup optional deps (npm bug #4828)
        run: npm install @rollup/rollup-linux-x64-gnu --no-save --force

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint || true

      - name: Typecheck
        run: npx tsc --noEmit || true

      # Middleware ainda excluído: bug ESM entre vitest e next-auth@beta
      # (Cannot find module 'next/server' em next-auth/lib/env.js).
      - name: Testes unit
        run: npx vitest run --exclude 'src/middleware/**'
