x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ── Aplicação Next.js ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - "3001:3000"
    env_file: .env
    depends_on:
      pnab-postgres:
        condition: service_healthy
      pnab-redis:
        condition: service_healthy
    networks:
      - pnab-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000${BASE_PATH:-}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Worker BullMQ (email, PDF) ──────────────────────────────────────────────
  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    command: ["node", "worker.cjs"]
    env_file: .env
    depends_on:
      pnab-postgres:
        condition: service_healthy
      pnab-redis:
        condition: service_healthy
    networks:
      - pnab-network
    restart: unless-stopped
    logging: *default-logging

  # Migration: rodada via `docker compose run --rm app npx prisma db push`
  # no workflow de deploy (não há service `migrate` separado — antigo service
  # usava `target: builder` e o cache do Docker servia um schema.prisma antigo,
  # fazendo `db push` reportar "in sync" enquanto a DB ficava desatualizada).

  # ── PostgreSQL (isolado) ────────────────────────────────────────────────────
  pnab-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pnab_postgres_data:/var/lib/postgresql/data
    networks:
      - pnab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ── Redis (isolado) ─────────────────────────────────────────────────────────
  pnab-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - pnab_redis_data:/data
    networks:
      - pnab-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

volumes:
  pnab_postgres_data:
  pnab_redis_data:

networks:
  pnab-network:
    driver: bridge
